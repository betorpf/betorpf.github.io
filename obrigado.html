<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagem enviada — Roberto Passareti Filho</title>
  <meta name="description" content="Confirmação de envio da mensagem para Roberto Passareti Filho.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102c26">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--night:#102c26;--chalk:#f3efe5;--code:#91b6a0;--dim:rgba(243,239,229,.68);--seam:rgba(243,239,229,.22)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;display:grid;place-items:center;
      background:var(--night);color:var(--chalk);
      font-family:"IBM Plex Sans",system-ui,sans-serif;
      line-height:1.5;padding:24px;
    }
    main{
      width:min(620px,100%);border:1px solid var(--seam);
      background:linear-gradient(150deg,rgba(145,182,160,.16),rgba(145,182,160,.03));
      padding:clamp(28px,7vw,52px);
    }
    .kicker{
      color:var(--code);font-family:"IBM Plex Mono",monospace;
      font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    }
    h1{
      font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
      font-size:clamp(36px,8vw,58px);line-height:1;letter-spacing:-.035em;
      margin:12px 0 18px;
    }
    p{color:var(--dim);font-size:17px;max-width:42ch}
    a{
      display:inline-block;margin-top:28px;border:1px solid var(--code);
      background:var(--code);color:var(--night);padding:11px 18px;
      font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
      letter-spacing:.08em;text-decoration:none;text-transform:uppercase;
    }
    a:hover{background:transparent;color:var(--code)}
    a:focus-visible{outline:2px solid var(--chalk);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <span class="kicker">Mensagem enviada</span>
    <h1>Obrigado pelo contato.</h1>
    <p>Recebi sua mensagem. Se você deixou um e-mail, responderei por lá assim que puder.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
