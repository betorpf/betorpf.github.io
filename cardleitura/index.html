<style>
:root{color-scheme:light;--bg:#f4f1eb;--ink:#25241f;--muted:#716e66;--line:#ded8cd;--accent:#d96546}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}header,main{max-width:1120px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem)}header p{color:var(--muted)}main{display:grid;grid-template-columns:minmax(270px,390px) minmax(0,1fr);gap:22px;align-items:start}.panel{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:18px}label{display:block;margin:12px 0 5px;font-weight:650;font-size:.9rem}input,select,textarea{width:100%;padding:10px;border:1px solid #cbc4b8;border-radius:9px;font:inherit;background:#fff;color:#25241f;-webkit-text-fill-color:#25241f; color-scheme:light; caret-color:#25241f}input[type=file]{padding:6px;color:#25241f;-webkit-text-fill-color:#25241f}input::placeholder,textarea::placeholder{color:#716e66;opacity:1;-webkit-text-fill-color:#716e66}input:focus,select:focus,textarea:focus{outline:2px solid #d9654680;outline-offset:1px}option,optgroup{color:#25241f;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer;background:#25241f;color:white}.secondary{background:#ece6dc;color:#25241f}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.help,.status{font-size:.82rem;color:var(--muted)}.palette-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}.swatch{display:flex;gap:7px;align-items:center;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);font-size:.76rem;padding:7px}.chips{display:flex;gap:3px}.chips i{width:12px;height:22px;border-radius:3px;display:block}.preview{position:sticky;top:12px;min-width:0}.previewhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.previewhead h2{margin:0}canvas{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 12px 28px #0001}.fixed{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:14px;overflow-wrap:anywhere}.fixed p{margin:4px 0}.library{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.saved{border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px;display:flex;gap:8px;align-items:center}.saved span{flex:1;font-size:.85rem}.saved button{padding:6px 8px;font-size:.75rem}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.preview{position:static;grid-row:1}header{padding:16px 12px}}
</style></head><body>
<header><h1>Gerador de Cards de Leitura</h1><p>Registre seu progresso e compartilhe a leitura — com os links e QR Codes do Viagem em Quadros.</p></header>
<main><section class="panel">
<label for="book">Nome do livro / HQ</label><input id="book" placeholder="Ex.: Daytripper">
<label for="author">Autor(a)</label><input id="author" placeholder="Nome do autor">
<label for="cover">Capa do livro</label><input id="cover" type="file" accept="image/*">
<label for="mode">Como informar o avanço</label><select id="mode"><option value="pages">Páginas lidas / total</option><option value="kindle">Posição Kindle / final</option><option value="percent">Percentual direto</option></select>
<div id="nums" class="row"><div><label for="current">Lidas / atual</label><input id="current" type="number" min="0" value="120"></div><div><label for="total">Total / final</label><input id="total" type="number" min="1" value="300"></div></div>
<div id="pfield" hidden><label for="percent">Percentual concluído</label><input id="percent" type="number" min="0" max="100" value="40"></div>
<label for="note">Frase curta (opcional)</label><input id="note" placeholder="Mais um capítulo antes de dormir…">
<label>Paleta de cores</label>
<p class="help">Toque em uma amostra para aplicar ao card.</p>
<div id="gallery" class="palette-grid"></div><select id="style" hidden aria-hidden="true" tabindex="-1"></select>
<label for="model">Modelo de postagem</label><select id="model"><option value="editorial">Editorial — capa + progresso</option><option value="cover">Capa em destaque</option><option value="minimal">Minimalista</option><option value="journal">Diário de leitura</option></select>

<div class="buttons"><button id="download">Baixar PNG</button><button class="secondary" id="save">Salvar leitura</button><button class="secondary" id="clear">Limpar</button></div>
<p class="help" id="saveStatus">Os dados são salvos neste navegador.</p>
<div class="library"><h3>Leituras salvas</h3><div id="library"></div></div>
</section><section class="preview"><div class="previewhead"><h2>Prévia do card</h2><span class="help">1080 × 1350 · 4:5</span></div><canvas id="canvas" width="1080" height="1350"></canvas><p class="status" id="status">Prévia atualizada.</p></section></main>
<script>

',ink:'#112F60',muted:'#526D98',accent:'#E5A928',panel:'#F8FAFF',line:'#C4D5F1'},european:{label:'Quadrinhos europeus',bg:'#EDE4D7',ink:'#393027',muted:'#7A6B5A',accent:'#B36B43',panel:'#FCF8F0',line:'#DCCBB6'},national:{label:'Quadrinhos nacionais',bg:'#F5E8D9',ink:'#3B2F27',muted:'#806B5A',accent:'#3F8A68',panel:'#FFFAF3',line:'#DFCCB7'},graphicnovel:{label:'Graphic novels',bg:'#E8E3DF',ink:'#302A29',muted:'#746965',accent:'#9B5149',panel:'#FBF8F5',line:'#D4C9C3'},humorstrips:{label:'Tiras e humor gráfico',bg:'#FFF0BD',ink:'#29291F',muted:'#716A49',accent:'#E35A36',panel:'#FFFCED',line:'#E7D88D'}};
let cover=null,coverData=null,qrBlog=null,qrGenerator=null,qrBlogReady=false,qrGeneratorReady=false;
function roundPath(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function box(x,y,w,h,r,fill,stroke){roundPath(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function wrap(t,x,y,max,lineH,maxLines=3){let lines=[],line='';for(const word of (t||'').split(/\s+/)){const test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines.slice(0,maxLines).forEach((s,i)=>ctx.fillText(s,x,y+i*lineH));return Math.min(lines.length,maxLines)*lineH}
function progress(){let p,detail;if($('mode').value==='percent'){p=+($('percent').value||0);detail='PROGRESSO DE LEITURA'}else{let a=Math.max(0,+$('current').value||0),b=Math.max(1,+$('total').value||1);p=a/b*100;detail=$('mode').value==='pages'?`${a} de ${b} páginas`:`posição ${a} de ${b}`}return {p:Math.max(0,Math.min(100,p)),detail}}
function coverDraw(x,y,w,h,c){box(x-7,y-7,w+14,h+14,12,'#FFFFFF40');if(cover){let iw=cover.naturalWidth,ih=cover.naturalHeight,s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;ctx.save();roundPath(x,y,w,h,7);ctx.clip();ctx.drawImage(cover,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);ctx.restore()}else{box(x,y,w,h,7,'#D9C7B2');ctx.fillStyle='#8C7663';ctx.textAlign='center';ctx.font='700 28px system-ui';ctx.fillText('SUA CAPA',x+w/2,y+h/2)}}
function qr(x,y,s,img,c){ctx.fillStyle='#fff';ctx.fillRect(x,y,s,s);ctx.strokeStyle=c.line;ctx.strokeRect(x,y,s,s);if(img)try{ctx.drawImage(img,x+3,y+3,s-6,s-6)}catch(e){}else{ctx.fillStyle=c.ink;ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText('QR',x+s/2,y+s/2)}}

 ctx.textAlign='left'}

footer(c);$('status').textContent='Prévia atualizada · '+Math.round(p)+'%';}catch(e){$('status').textContent='Erro ao desenhar o card: '+e.message;}}
function saveState(){try{let d={};['book','author','mode','current','total','percent','note','style','model'].forEach(k=>d[k]=$(k).value);d.coverData=coverData;localStorage.setItem(STORE,JSON.stringify(d));$('saveStatus').textContent='Salvo automaticamente neste navegador.'}catch(e){$('saveStatus').textContent='Não foi possível salvar (armazenamento cheio).'}}
function restore(){try{let d=JSON.parse(localStorage.getItem(STORE)||'null');if(!d)return;Object.keys(d).forEach(k=>{if($(k))$(k).value=d[k]});if(d.coverData){coverData=d.coverData;let im=new Image();im.onload=()=>{cover=im;render()};im.src=d.coverData}}catch(e){}}
function getLib(){try{return JSON.parse(localStorage.getItem(LIB)||'[]')}catch(e){return []}}
function showLib(){let host=$('library');host.innerHTML='';let list=getLib();if(!list.length){host.textContent='Nenhuma leitura salva ainda.';return}list.slice().reverse().forEach(it=>{let row=document.createElement('div');row.className='saved';let s=document.createElement('span');s.textContent=it.book+' · '+it.progress+'%';let b=document.createElement('button');b.textContent='Abrir';b.onclick=()=>{Object.keys(it.data).forEach(k=>{if($(k))$(k).value=it.data[k]});coverData=it.data.coverData||null;cover=null;if(coverData){let im=new Image();im.onload=()=>{cover=im;render()};im.src=coverData}render();saveState()};let del=document.createElement('button');del.textContent='Excluir';del.onclick=()=>{localStorage.setItem(LIB,JSON.stringify(getLib().filter(x=>x.id!==it.id)));showLib()};row.append(s,b,del);host.append(row)})}

function qrLoad(url,cb,which){
 const im=new Image();
 im.onload=()=>{cb(im);if(which==='blog')qrBlogReady=true;if(which==='generator')qrGeneratorReady=true;render();$('status').textContent='QR Codes fixos prontos.'};
 im.onerror=()=>{$('status').textContent='Falha ao carregar QR Code embutido.'};
 im.src=(which==='blog')?QR_BLOG_DATA:QR_GENERATOR_DATA;
}
Object.entries(palettes).forEach(([key,p])=>{let op=document.createElement('option');op.value=key;op.textContent=p.label;$('style').append(op);let b=document.createElement('button');b.className='swatch';b.type='button';let chips=document.createElement('span');chips.className='chips';[p.bg,p.accent,p.panel].forEach(color=>{let i=document.createElement('i');i.style.background=color;chips.append(i)});let t=document.createElement('span');t.textContent=p.label;b.append(chips,t);b.onclick=()=>{$('style').value=key;render();saveState()};$('gallery').append(b)});
['book','author','mode','current','total','percent','note','style','model'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='mode'){$('nums').hidden=$('mode').value==='percent';$('pfield').hidden=$('mode').value!=='percent'}render();saveState()}));
$('cover').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{coverData=r.result;let im=new Image();im.onload=()=>{cover=im;render();saveState()};im.src=coverData};r.readAsDataURL(f)});
$('download').onclick=()=>{render();if(!qrBlogReady||!qrGeneratorReady){$('status').textContent='Aguarde os dois QR Codes carregarem antes de baixar o PNG.';return}try{let a=document.createElement('a');a.download='card-leitura-viagem-em-quadros.png';a.href=canvas.toDataURL('image/png');a.click();$('status').textContent='Card baixado com os dois QR Codes.'}catch(e){$('status').textContent='Não foi possível exportar a imagem. Recarregue a página e tente novamente.'}};
$('save').onclick=()=>{let book=$('book').value.trim();if(!book){alert('Informe o título do livro.');return}let d={};['book','author','mode','current','total','percent','note','style','model'].forEach(k=>d[k]=$(k).value);d.coverData=coverData;let {p}=progress();let list=getLib();list.push({id:Date.now(),book,progress:Math.round(p),data:d});try{localStorage.setItem(LIB,JSON.stringify(list));showLib()}catch(e){alert('Armazenamento cheio; não foi possível salvar.')}};
$('clear').onclick=()=>{if(!confirm('Limpar os campos atuais?'))return;['book','author','note'].forEach(k=>$(k).value='');$('current').value=0;$('total').value=1;$('percent').value=0;cover=null;coverData=null;$('cover').value='';render();saveState()};
restore();$('nums').hidden=$('mode').value==='percent';$('pfield').hidden=$('mode').value!=='percent';showLib();
qrLoad('https://www.viagememquadros.blog.br/',im=>qrBlog=im,'blog');qrLoad('https://betorpf.com.br/cardleitura/',im=>qrGenerator=im,'generator');render();
</script></body></html>
